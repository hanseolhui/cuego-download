<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큐GO 받기 · CueGO Download</title>
<meta name="description" content="큐GO — 공연 음악을 큐 순서대로, GO 하나로. 맥 · 윈도우 받기">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#0a0a0b; --card:#141415; --line:#3a3a3d; --ink:#f3f1ea; --dim:#a9a69e; --go:#2bff88; --tape-ink:#111; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:520px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:16px; display:inline-block; margin-bottom:18px; }
  h1 { font-size:34px; font-weight:800; margin:0 0 8px; letter-spacing:-1px; }
  p.lead { color:var(--dim); margin:0 0 28px; line-height:1.5; }
  .main-btn { display:block; background:var(--ink); color:#0a0a0b; text-decoration:none; font-weight:800; font-size:19px;
              padding:18px 20px; border-radius:8px; margin-bottom:10px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:26px; }
  .other { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:34px; }
  .other a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:10px 14px; font-weight:700; font-size:14px; }
  .card { position:relative; background:var(--card); border:1px solid #2a2a2c; border-radius:8px; padding:24px 20px 18px; text-align:left; font-size:14px; line-height:1.6; color:var(--dim); }
  .card b { color:var(--ink); }
  .card a { color:var(--go); }
  .tape { position:absolute; left:14px; top:-12px; background:var(--go); color:var(--tape-ink); font-weight:800; font-size:12px; line-height:1;
          padding:6px 12px 6px 11px; transform:rotate(-1.4deg);
          clip-path:polygon(2px 0, 100% 0, calc(100% - 3px) 32%, 100% 58%, calc(100% - 2px) 100%, 0 100%, 3px 62%, 0 30%); }
  footer { color:#6d6a64; font-size:12px; margin-top:22px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-192.png" alt="큐GO" width="72" height="72">
  <h1 id="title">큐GO 받기</h1>
  <p class="lead" id="lead">공연 음악을 큐 순서대로, GO 하나로.</p>

  <a class="main-btn" id="main" href="#">받기</a>
  <div class="sub" id="sub"></div>

  <div class="other" id="other"></div>

  <div class="card"><span class="tape" id="tape">설치</span><div id="how"></div></div>
  <footer><a href="support.html" style="color:inherit">고객 지원 · Support</a> · <a href="privacy.html" style="color:inherit">개인정보처리방침 · Privacy</a><br>help@seoriarts.com · © SeoriArts</footer>
</main>
<script>
  // 들어온 기기에 맞는 받기를 크게, 나머지는 작게 (한 페이지 · 링크 하나)
  const base = 'https://github.com/hanseolhui/cuego-download/releases/latest/download/';
  const ua = navigator.userAgent, plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  const ko = (navigator.language || 'ko').toLowerCase().startsWith('ko');
  const t = (k, e) => ko ? k : e;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(plat) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const isWin = /Win/.test(plat) || /Windows/.test(ua);
  const isMac = !isIOS && /Mac/.test(plat + ua);
  const L = {
    mac: { label: t('맥용 받기', 'Download for Mac'), href: base + 'CueGO-mac.dmg', sub: t('macOS 12 이상 · 애플 공증', 'macOS 12+ · Notarized by Apple') },
    win: { label: t('윈도우용 받기', 'Download for Windows'), href: base + 'CueGO-windows-setup.exe', sub: t('윈도우 10 · 11 (64비트)', 'Windows 10 / 11 (64-bit)') },
    ios: { label: t('앱스토어에서 받기', 'Get it on the App Store'), href: 'https://apps.apple.com/app/id6815447098', sub: t('아이폰 · 아이패드', 'iPhone · iPad') },
    and: { label: t('구글 플레이에서 받기', 'Get it on Google Play'), href: 'https://play.google.com/store/apps/details?id=com.seoriarts.cuego', sub: t('안드로이드 폰 · 태블릿', 'Android phone · tablet') },
  };
  const first = isIOS ? 'ios' : isAndroid ? 'and' : isWin ? 'win' : 'mac';
  document.title = t('큐GO 받기', 'Download CueGO');
  document.getElementById('title').textContent = t('큐GO 받기', 'Download CueGO');
  document.getElementById('lead').textContent = t('공연 음악을 큐 순서대로, GO 하나로.', 'Your show music, cue by cue — one GO.');
  const main = document.getElementById('main');
  main.textContent = L[first].label; main.href = L[first].href;
  document.getElementById('sub').textContent = L[first].sub;
  document.getElementById('other').innerHTML = ['mac', 'win', 'ios', 'and'].filter(k => k !== first)
    .map(k => `<a href="${L[k].href}">${L[k].label}</a>`).join('');
  const how = {
    mac: t('<b>맥</b> — 받은 <b>CueGO-mac.dmg</b> 를 열고, <b>CueGO</b> 를 옆의 «응용 프로그램» 폴더로 끌어 놓으면 설치 끝.',
           '<b>Mac</b> — Open <b>CueGO-mac.dmg</b> and drag <b>CueGO</b> onto the Applications folder next to it. Done.'),
    win: t('<b>윈도우</b> — 받은 <b>설치 파일</b>을 열고 「다음」만 누르면 시작 메뉴·바탕화면에 큐GO 가 생깁니다. «PC 보호»가 뜨면 「추가 정보 → 실행」.',
           '<b>Windows</b> — Run the <b>installer</b> and click Next; CueGO appears in the Start menu and on your desktop. If SmartScreen appears: More info → Run anyway.'),
    ios: t('<b>아이폰 · 아이패드</b> — 앱스토어에서 «큐GO»를 받으세요.', '<b>iPhone · iPad</b> — Get “CueGO” on the App Store.'),
    and: t('<b>안드로이드</b> — 플레이스토어에서 «큐GO»를 받으세요.', '<b>Android</b> — Get “CueGO” on Google Play.'),
  };
  document.getElementById('tape').textContent = t('설치', 'INSTALL');
  document.getElementById('how').innerHTML = how[first] + '<br><br>' +
    t('직접 다운로드 1.3.24 · 맥 · 윈도우 · 안드로이드 APK. 긴 글이 낱말 가운데서 끊기지 않고, 감독 화면은 작은 폰에서도 남은 초가 항상 보이며, 리모컨은 연결 상태를 먼저 보여 줍니다. App Store와 Google Play의 공개 버전은 각 스토어에서 확인하세요.',
      'Direct downloads 1.3.24 for Mac, Windows and Android APK. Text layout fixes for small phones and large text, a crew screen that keeps the countdown visible on small phones, and a remote that shows its connection status first. Check each store for its public version.') + '<br><br>' +
    t('가입 후 기기에 내려받은 공연은 오프라인으로 실행할 수 있습니다. 같은 Wi-Fi 리모컨 1대가 무료이며, 인터넷 리모컨과 인터넷 감독 화면에는 이용권이 필요합니다. 이미 열린 공연의 연결은 이용 기간이 끝나도 유지됩니다.',
      'After signup, downloaded shows can run offline. One remote on the same Wi-Fi is free. Internet remotes and internet crew screens require an active Pass. Existing connections stay open through a show already underway.') + '<br><br><a href="https://apps.seoriarts.com/cuego-devices">' + t('구매 이메일로 등록 기기 관리', 'Manage devices with your purchase email') + '</a> · <a href="' + base + 'CueGO-android.apk">' + t('안드로이드 APK 직접 받기', 'Download Android APK') + '</a><br>' + t('Google Play로 설치했다면 스토어에서 업데이트하세요. 직접 APK는 Play 설치본 위에 설치되지 않습니다.', 'If you installed from Google Play, update through the store. The direct APK cannot update a Play installation.');
</script>
</body>
</html>
